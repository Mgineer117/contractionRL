label: c2rl (rl=sac, cm=cvstem)
algorithm: c2rl-sac
num_envs: 64

method: grid

metric:
  name: "Stability/auc_mean"
  goal: minimize

runner:
  wrapper: true
  bad_value: 100.0

parameters:
  agent.discount_factor:
    values: [0.1, 0.3, 0.5, 0.7, 0.9, 0.99, 0.999]
  models.policy.backbone:
    values: [control-squashed, mlp-squashed]
  agent.learn_entropy:
    values: [true, false]
  agent.initial_entropy_value:
    values: [0.05, 0.2, 0.5]
  agent.use_reward_norm:
    values: [true, false]
  cm.control_scaler:
    values: [0.0, 0.1, 1.0, 3.0]
  agent.gradient_steps:
    value: 10
  agent.batch_size:
    value: 1024
  agent.polyak:
    value: 0.05
  agent.learning_rate:
    value: 1.0e-5
