label: c3m
algorithm: c3m
num_envs: 64

metric:
  name: "Stability/contraction_score_mean"
  goal: maximize

parameters:
  agent.lbd:
    values: [0.01, 0.05, 0.1, 0.3, 0.5, 1.0, 2.0]
  agent.eps:
    values: [0.01, 0.1, 0.5, 1.0]
  agent.W_lr:
    values: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3]
  agent.c1_c2_scale:
    values: [0.01, 0.05, 0.1, 0.3, 0.5, 1.0]
  models.policy.backbone:
    values: [control, control-squashed]
  agent.actor_lr:
    values: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3]
  agent.actor_architecture:
    values:
      - [64, 64]
      - [128, 128]
      - [512, 512]
      - [128, 128, 128, 128]
  agent:
    values:
      - {w_lb: 0.5, w_ub: 1.5}
      - {w_lb: 0.3, w_ub: 1.5}
      - {w_lb: 0.2, w_ub: 2.0}
      - {w_lb: 0.5, w_ub: 5.0}
      - {w_lb: 0.1, w_ub: 10.0}
      - {w_lb: 0.01, w_ub: 10.0}
      - {w_lb: 0.1, w_ub: 100.0}
