seed: 42
models:
  encoder:
    feature_dim: null  # null defaults to 3 * x_dim per GRU.
    encoder_window: null  # null uses ceil(1 / (1 - discount_factor)) steps for each past/future window.
  separate: true
  policy:
    class: GaussianMixin
    encoder: null  # No GRU; use gru to encode past and future context.
    clip_actions: false
    clip_log_std: true
    min_log_std: -6.9
    max_log_std: 2.0
    network:
    - name: net
      input: OBSERVATIONS
      layers:
      - 256
      - 256
      activations: tanh
    output: ACTIONS
    initial_log_std: -0.5
    control_mode: structured
  value:
    encoder: gru  # Separate GRUs encode past and future context.
    class: DeterministicMixin
    network:
    - name: net
      input: OBSERVATIONS
      layers:
      - 256
      - 256
      activations: tanh
    output: ONE
memory:
  class: RandomMemory
  memory_size: -1
agent:
  class: PPO
  rollouts: 64
  learning_epochs: 5
  mini_batches: 4
  gae_lambda: 0.95
  learning_rate: 1.0e-05
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
    kl_factor: 2
    lr_factor: 1.5
    min_lr: 1.0e-06
    max_lr: 0.0001
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 0.5
  ratio_clip: 0.2
  value_clip: 0.0
  entropy_loss_scale: 0.0
  value_loss_scale: 2.5
  kl_threshold: 0.032
  time_limit_bootstrap: true
  rewards_shaper_scale: 0.1
  use_value_norm: true
  discount_factor: 0.995
  experiment:
    directory: car_ppo
    experiment_name: ''
    write_interval: auto
    checkpoint_interval: auto
    wandb: true
    wandb_kwargs:
      project: contractionRL
      name: null
  use_value_expansion: true
  value_expansion_horizon: 10
  value_expansion_batch_size: null  # Defaults to agent.rollouts.
  action_bound_penalty: 1.0
trainer:
  class: SequentialTrainer
  timesteps: 500000
  environment_info: log
