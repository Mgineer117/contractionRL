extends: skrl_ppo_cfg.yaml
models:
  cmg:
    class: CMG
    network:
    - name: net
      input: OBSERVATIONS
      layers:
      - 128
      - 128
      activations: tanh
agent:
  class: C2RL-PPO
  experiment:
    directory: humanoid_c2rl_ppo
cm:
  ccm_w_ub: 10.0
  ccm_w_lb: 0.1
  ccm_lbd: 0.01
  cvstem_w_ub: 10.0
  cvstem_w_lb: 0.1
  cvstem_lbd: 0.01
  tracking_scaler: 1.0
  control_scaler: 0.0
  cm_eps: 0.01
  cm_solver: MOSEK
cmg:
  ccm_memory_size: 100000
  ccm_batch_size: 1024
  cvstem_memory_size: 10000
  cvstem_batch_size: 512
trainer:
  class: C2RLSkrlTrainer
