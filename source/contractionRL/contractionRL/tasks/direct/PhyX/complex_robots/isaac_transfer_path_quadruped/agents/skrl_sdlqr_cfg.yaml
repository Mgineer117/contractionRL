extends: dynamics_cfg.yaml
seed: 42
models:
  separate: true

agent:
  class: SDLQR
  Q_scaler: 1.0
  R_scaler: 0.01
  experiment:
    directory: "quadruped_sdlqr"
    experiment_name: ""
    write_interval: "auto"
    checkpoint_interval: "auto"
    wandb: true
    wandb_kwargs:
      project: contractionRL
      name:

trainer:
  class: SequentialTrainer
  timesteps: 50000
  environment_info: log
