extends: dynamics_cfg.yaml
seed: 42

models:
  encoder:
    feature_dim: null  # null defaults to 3 * x_dim per GRU.
    encoder_window: null  # null uses ceil(1 / (1 - discount_factor)) steps for each past/future window.
  separate: true
  policy:
    encoder: null  # No GRU; use gru to encode past and future context.
    class: GaussianMixin
    clip_actions: false
    clip_log_std: true
    min_log_std: -20.0
    max_log_std: 2.0
    network:
    - name: net
      input: OBSERVATIONS
      layers: [256, 256]
      activations: tanh
    output: ACTIONS
    initial_log_std: 0.0
  critic:
    encoder: gru  # Separate GRUs encode past and future context.
    class: DeterministicMixin
    network:
    - name: net
      input: concatenate([OBSERVATIONS, ACTIONS])
      layers: [512, 512, 512, 512]
      activations: relu
    output: ONE
memory:
  class: RandomMemory
  memory_size: 244

agent:
  class: C2RL-SAC
  gradient_steps: 32
  batch_size: 1024
  polyak: 0.005
  learning_rate: 1.0e-5
  learn_entropy: true
  initial_entropy_value: 0.2
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 0.5
  discount_factor: 0.99
  experiment:
    directory: "quadruped_c2rl_sac"
    experiment_name: ""
    write_interval: "auto"
    checkpoint_interval: "auto"
    wandb: true
    wandb_kwargs:
      project: contractionRL
      name:

cm:
  ccm_w_ub: 10.0
  ccm_w_lb: 0.1
  ccm_lbd: 0.01
  cvstem_w_ub: 10.0
  cvstem_w_lb: 0.1
  cvstem_lbd: 0.01
  tracking_scaler: 1.0
  control_scaler: 0.0
  cm_eps: 0.01
  cm_solver: MOSEK

cmg:
  ccm_memory_size: 100000
  ccm_batch_size: 1024
  cvstem_memory_size: 10000
  cvstem_batch_size: 512

trainer:
  class: C2RLSkrlTrainer
  timesteps: 30000
