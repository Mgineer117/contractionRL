extends: skrl_ppo_cfg.yaml
models:
  cmg:
    class: CMG
    network:
    - name: net
      input: OBSERVATIONS
      layers:
      - 128
      - 128
      activations: tanh
agent:
  class: C2RL-PPO
  experiment:
    directory: car_c2rl_ppo
cm:
  ccm_w_ub: 10.0
  ccm_w_lb: 0.1
  ccm_lbd: 0.5
  cvstem_w_ub: 10.0
  cvstem_w_lb: 0.1
  cvstem_lbd: 0.3902
  tracking_scaler: 1.0
  control_scaler: 0.0
  cm_eps: 0.01
  cm_solver: MOSEK
  cvstem_r_scaler: 1.6
  cm_data_path: data/classic/car/cm_data.npz
cmg:
  ccm_memory_size: 100000
  ccm_batch_size: 1024
  cvstem_memory_size: 10000
  cvstem_batch_size: 512
  regress_epochs: 3000
  regress_lr: 0.001
  regress_lr_scheduler: StepLR
  regress_lr_scheduler_kwargs:
    step_size: 1
    gamma: 0.999
  early_stop_patience: 300
trainer:
  class: C2RLSkrlTrainer
