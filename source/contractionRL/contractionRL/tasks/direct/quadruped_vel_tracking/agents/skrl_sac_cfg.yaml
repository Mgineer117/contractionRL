mode: sim_to_real
seed: 42
models:
  separate: true
  policy:
    class: GaussianMixin
    backbone: mlp-squashed
    clip_log_std: true
    min_log_std: -20.0
    max_log_std: 2.0
    network:
    - name: net
      input: OBSERVATIONS
      layers: [256, 256]
      activations: tanh
    output: ACTIONS
  critic_1:
    class: DeterministicMixin
    network:
    - name: net
      input: concatenate([OBSERVATIONS, ACTIONS])
      layers: [256, 256]
      activations: tanh
    output: ONE
  critic_2:
    class: DeterministicMixin
    network:
    - name: net
      input: concatenate([OBSERVATIONS, ACTIONS])
      layers: [256, 256]
      activations: tanh
    output: ONE
  target_critic_1:
    class: DeterministicMixin
    network:
    - name: net
      input: concatenate([OBSERVATIONS, ACTIONS])
      layers: [256, 256]
      activations: tanh
    output: ONE
  target_critic_2:
    class: DeterministicMixin
    network:
    - name: net
      input: concatenate([OBSERVATIONS, ACTIONS])
      layers: [256, 256]
      activations: tanh
    output: ONE
memory:
  class: RandomMemory
  memory_size: 10000
agent:
  class: SAC
  gradient_steps: 6
  batch_size: 512
  discount_factor: 0.999
  polyak: 0.005
  learning_rate: 1.0e-5
  learn_entropy: true
  initial_entropy_value: 0.2
  random_timesteps: 10000
  learning_starts: 10000
  grad_norm_clip: 1.0
  experiment:
    directory: quadruped_vel_tracking_sac
    experiment_name: ''
    write_interval: auto
    checkpoint_interval: auto
    wandb: true
    wandb_kwargs:
      project: contractionRL
      name:
  use_state_norm: false
trainer:
  class: SequentialTrainer
  timesteps: 30000
  environment_info: log
