mode: analytical
seed: 42


agent:
  class: CVSTEM-LQR
  r_scaler: 1.6
  experiment:
    directory: "cartpole_cvstem_lqr"
    experiment_name: ""
    write_interval: "auto"
    checkpoint_interval: "auto"
    wandb: true
    wandb_kwargs:
      project: contractionRL
      name:

cm:
  lbd: 0.3902
  cm_eps: 0.01
  cm_w_lb: 0.001
  cm_w_ub: 1000.0
  cm_solver: MOSEK
  cm_samples: 10000
  cm_seed: 0
  cm_data_path: "data/classic/cartpole/cvstem.npz"

cmg:
  cmg_hidden_dims: [100, 100, 100]
  cmg_regress_epochs: 100
  cmg_regress_lr: 1.0e-3
  cmg_regress_batch_size: 320
  cmg_regress_lr_scheduler: "StepLR"
  cmg_regress_lr_scheduler_kwargs:
    step_size: 1
    gamma: 0.99
trainer:
  class: SequentialTrainer
  timesteps: 10000
  environment_info: log
