mode: analytical
seed: 42

models:
  separate: true
  policy:
    class: GaussianMixin
    backbone: control
    clip_actions: false
    clip_log_std: true
    min_log_std: -20.0
    max_log_std: 2.0
    network:
    - name: net
      input: OBSERVATIONS
      layers: [128, 128]
      activations: tanh
    output: ACTIONS
    initial_log_std: -0.5
  critic:
    class: DeterministicMixin
    network:
    - name: net
      input: OBSERVATIONS
      layers: [128, 128]
      activations: tanh
    output: ONE
  dynamics:
    class: NeuralDynamics
    network:
    - name: net
      input: STATE_ACTION
      layers: [128, 128]
      activations: tanh
  cmg:
    class: CMG
    network:
    - name: net
      input: OBSERVATIONS
      layers: [128, 128]
      activations: tanh

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: C2RL-PPO
  rollouts: 24
  learning_epochs: 5
  mini_batches: 4
  gae_lambda: 0.95
  learning_rate: 1.0e-5
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
    kl_factor: 2
    lr_factor: 1.5
    min_lr: 1.0e-6
    max_lr: 1.0e-4
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 0.5
  ratio_clip: 0.2
  value_clip: 0.0
  entropy_loss_scale: 0.0
  value_loss_scale: 0.5
  kl_threshold: 0.032
  time_limit_bootstrap: true
  rewards_shaper_scale: 1.0
  use_state_norm: false
  use_value_norm: true
  use_value_expansion: false
  value_expansion_horizon: 3
  value_expansion_batch_size: 512
  use_reward_norm: false


  discount_factor: 0.01
  experiment:
    directory: "tora_c2rl_ppo"
    experiment_name: ""
    write_interval: "auto"
    checkpoint_interval: "auto"
    wandb: true
    wandb_kwargs:
      project: contractionRL
      name:

cm:
  ccm_w_ub: 1000.0
  ccm_w_lb: 0.001
  ccm_lbd: 0.1156
  cvstem_w_ub: 1000.0
  cvstem_w_lb: 0.001
  cvstem_lbd: 0.1156
  tracking_scaler: 1.0
  control_scaler: 0.0
  cm_eps: 0.01
  cm_solver: MOSEK
  cvstem_r_scaler: 0.1
  cm_data_path: "data/classic/tora/cm_data.npz"

cmg:
  ccm_memory_size: 100000
  ccm_batch_size: 1024
  cvstem_memory_size: 10000
  regress_epochs: 3000
  regress_lr: 0.001
  regress_lr_scheduler: StepLR
  regress_lr_scheduler_kwargs:
    step_size: 1
    gamma: 0.999
  cvstem_batch_size: 512
  early_stop_patience: 300

empirical_dynamics:
  num_controls_per_state: 3
  dynamics_lr: 1.0e-3
  dynamics_lr_scheduler: "StepLR"
  dynamics_lr_scheduler_kwargs:
    step_size: 1
    gamma: 0.999
  dynamics_batch_size: 4096
  dynamics_pretrain_epochs: 100

trainer:
  class: C2RLSkrlTrainer
  timesteps: 1000000
