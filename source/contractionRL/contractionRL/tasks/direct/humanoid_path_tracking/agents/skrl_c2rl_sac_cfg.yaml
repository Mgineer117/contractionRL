mode: sim_to_real
seed: 42

models:
  separate: true
  policy:
    class: GaussianMixin
    backbone: control-squashed
    clip_actions: false
    clip_log_std: true
    min_log_std: -20.0
    max_log_std: 2.0
    network:
    - name: net
      input: OBSERVATIONS
      layers: [256, 256]
      activations: tanh
    output: ACTIONS
    initial_log_std: 0.0
  critic:
    class: DeterministicMixin
    network:
    - name: net
      input: concatenate([OBSERVATIONS, ACTIONS])
      layers: [256, 256]
      activations: relu
    output: ONE
  dynamics:
    class: NeuralDynamics
    network:
    - name: net
      input: STATE_ACTION
      layers: [128, 128]
      activations: tanh

memory:
  class: RandomMemory
  memory_size: 244

agent:
  class: C2RL-SAC
  gradient_steps: 32
  batch_size: 1024
  polyak: 0.005
  learning_rate: 1.0e-5
  learn_entropy: true
  initial_entropy_value: 0.2
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  use_state_norm: false
  discount_factor: 0.99
  experiment:
    directory: "humanoid_c2rl_sac"
    experiment_name: ""
    write_interval: "auto"
    checkpoint_interval: "auto"
    wandb: true
    wandb_kwargs:
      project: contractionRL
      name:

cm:
  ccm_w_ub: 10.0
  ccm_w_lb: 0.1
  ccm_lbd: 0.01
  cvstem_w_ub: 10.0
  cvstem_w_lb: 0.1
  cvstem_lbd: 0.01
  tracking_scaler: 1.0
  control_scaler: 0.0
  cm_eps: 0.01
  cm_solver: MOSEK

cmg:
  ccm_memory_size: 100000
  ccm_batch_size: 1024
  cvstem_memory_size: 10000
  cvstem_batch_size: 512

empirical_dynamics:
  num_controls_per_state: 3
  dynamics_lr: 1.0e-3
  dynamics_lr_scheduler: "StepLR"
  dynamics_lr_scheduler_kwargs:
    step_size: 1
    gamma: 0.99
  dynamics_batch_size: 4096
  dynamics_pretrain_epochs: 10000
  emp_dynamics_memory_size: 8192

trainer:
  class: C2RLSkrlTrainer
  timesteps: 30000
