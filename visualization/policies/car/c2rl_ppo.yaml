seed: 42

models:
  encoder:
    feature_dim: null  # null defaults to 3 * x_dim per GRU.
    encoder_window: null  # null uses ceil(1 / (1 - discount_factor)) steps for each past/future window.
  separate: true
  policy:
    class: GaussianMixin
    encoder: null  # No GRU; use gru to encode past and future context.
    clip_actions: false
    clip_log_std: true
    min_log_std: -6.9
    max_log_std: 2.0
    network:
    - name: net
      input: OBSERVATIONS
      layers:
      - 256
      - 256
      activations: tanh
    output: ACTIONS
    initial_log_std: -0.5
    control_mode: structured
  value:
    encoder: gru  # Separate GRUs encode past and future context.
    class: DeterministicMixin
    network:
    - name: net
      input: OBSERVATIONS
      layers:
      - 256
      - 256
      activations: tanh
    output: ONE
  cmg:
    class: CMG
    network:
    - name: net
      input: OBSERVATIONS
      layers: [128, 128]
      activations: tanh

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: C2RL-PPO
  rollouts: 64
  learning_epochs: 5
  mini_batches: 4
  gae_lambda: 0.95
  learning_rate: 1.0e-05
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
    kl_factor: 2
    lr_factor: 1.5
    min_lr: 1.0e-6
    max_lr: 1.0e-4
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 0.5
  ratio_clip: 0.2
  value_clip: 0.0
  entropy_loss_scale: 0.0
  value_loss_scale: 2.5
  kl_threshold: 0.032
  time_limit_bootstrap: true
  rewards_shaper_scale: 0.1
  use_value_norm: true
  use_value_expansion: true
  value_expansion_horizon: 10
  value_expansion_batch_size: null  # Defaults to agent.rollouts.
  discount_factor: 0.995
  action_bound_penalty: 1.0
  experiment:
    directory: "car_c2rl_ppo"
    experiment_name: ""
    write_interval: "auto"
    checkpoint_interval: "auto"
    wandb: true
    wandb_kwargs:
      project: contractionRL
      name:

cm:
  ccm_w_ub: 10.0
  ccm_w_lb: 0.1
  ccm_lbd: 0.5
  cvstem_w_ub: 10.0
  cvstem_w_lb: 0.1
  cvstem_lbd: 0.5
  tracking_scaler: 1.0
  control_scaler: 0.0
  cm_eps: 0.01
  cm_solver: MOSEK
  cmg_method: ccm
  cvstem_r_scaler: 1.0
  cm_data_path: "logs/classic/car/cm_data.npz"

cmg:
  ccm_memory_size: 100000
  ccm_batch_size: 1024
  cvstem_memory_size: 10000
  regress_epochs: 10
  regress_lr: 0.001
  regress_lr_scheduler: StepLR
  regress_lr_scheduler_kwargs:
    step_size: 1
    gamma: 0.99
  cvstem_batch_size: 512

trainer:
  class: C2RLSkrlTrainer
  timesteps: 50000
